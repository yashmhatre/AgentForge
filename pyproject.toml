[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-framework"
version = "0.1.0"
description = "A modular framework for coordinating specialized software agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yash Mhatre" }]
license = "Apache-2.0"
license-files = ["LICENSE", "src/agentforge_framework/skills/NOTICE"]
dependencies = [
    "pyyaml>=6.0",
]

# A wheel found on its own -- downloaded from a release, or sitting in a
# site-packages nobody remembers filling -- has to lead back somewhere. The
# repository is that somewhere: 0.1 publishes to no index, so there is no
# project page for the metadata to point at instead.
[project.urls]
Homepage = "https://github.com/yashmhatre/AgentForge"
Issues = "https://github.com/yashmhatre/AgentForge/issues"

# The distribution is decorated and the import package with it (ADR-0013), but
# the command a person types is not: `agentforge` on PATH is unclaimed, because
# the project that holds the name on PyPI ships a library and no console script.
[project.scripts]
agentforge = "agentforge_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentforge_framework = [
    ".claude-plugin/plugin.json",
    "workflows/*.yaml",
    "skills/**/*",
]

# `skills/**/*` is deliberately broad — a vendored skill is copied whole and its
# layout is upstream's business, not ours. The cost is that it also sweeps up
# whatever a local test run left behind, so the bytecode is excluded explicitly.
[tool.setuptools.exclude-package-data]
agentforge_framework = [
    "**/__pycache__/*",
    "**/*.py[cod]",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# Vendored third-party skills are never edited in place, so linting them reports
# 76 findings nobody here is allowed to act on. Same rule as ADR-0006: a bundle's
# internal style is upstream's business.
#
# `tests/fixtures` is recorded data rather than code. A fixture read by the
# Python extractor has to keep an unused import in it, because that import is
# the thing being extracted.
[tool.ruff]
extend-exclude = ["src/agentforge_framework/skills", "tests/fixtures"]
