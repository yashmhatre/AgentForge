[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge"
version = "0.1.0"
description = "A modular framework for coordinating specialized software agents."
requires-python = ">=3.11"
authors = [{ name = "Yash Mhatre" }]
license = "Apache-2.0"
license-files = ["LICENSE", "src/agentforge/skills/NOTICE"]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
agentforge = "agentforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentforge = [
    ".claude-plugin/plugin.json",
    "workflows/*.yaml",
    "skills/**/*",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
