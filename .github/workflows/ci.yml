name: CI

on:
  pull_request:
  push:
    branches: [main]
  # `release.yml` gates the upload on this matrix rather than on a copy of it,
  # so the Python versions a release is proved against are edited in one place
  # and stay the ones `test_the_matrix_runs_every_python_the_metadata_claims`
  # holds to `requires-python` (#77).
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `requires-python = ">=3.11"` promises every release from 3.11 upward,
        # so the matrix runs every one of them that exists. Narrowing the claim
        # was the alternative; nothing in the codebase is version-shy, so the
        # honest fix was to test what was already being promised (#52).
        # tests/test_docs.py fails if this list and that claim ever drift apart.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  # Every job above is `ubuntu-latest`, where a command line may run to roughly
  # 2MB. Windows `CreateProcess` stops at 32,767 characters, so `decompose` died
  # on the author's own machine while CI stayed green through a release (#100).
  # A platform nobody runs is a platform nobody supports.
  #
  # One entry at the floor of `requires-python` rather than the whole matrix
  # doubled: the bugs this catches are about the operating system — path
  # separators, line endings, process limits — and not about the language level.
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  # The suite above runs against an editable install, which leaves the source
  # tree on disk in its original shape and so proves nothing about packaging.
  # This job builds the wheel a release attaches, installs it where the source
  # tree cannot be imported, and drives the console script from there.
  wheel:
    name: installed wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The floor of `requires-python`. The wheel is `py3-none-any`, so this job
      # is about package data rather than language level, and the oldest
      # interpreter the metadata admits is the one most likely to object.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the wheel
        run: |
          pip install build
          python -m build --wheel

      # `$RUNNER_TEMP/wheel-check` from here on: a virtual environment outside
      # the checkout, holding nothing but the wheel and its dependencies.
      - name: Install it into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/pip" install --quiet dist/*.whl

      # Every step from here runs outside the checkout, so an import that
      # succeeds succeeded from site-packages.
      - name: The install is what answers, not the checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-check/bin/python" - <<'PY'
          from importlib.metadata import version

          import agentforge_framework as package

          if "site-packages" not in package.__file__:
              raise SystemExit(f"imported from {package.__file__}, not from the wheel")
          print(f"agentforge-framework {version('agentforge-framework')} at {package.__file__}")
          PY

      - name: "`agentforge --version` resolves and answers"
        working-directory: ${{ runner.temp }}
        run: |
          reported=$("$RUNNER_TEMP/wheel-check/bin/python" -c 'from importlib.metadata import version; print(version("agentforge-framework"))')
          expected="agentforge $reported"
          actual=$("$RUNNER_TEMP/wheel-check/bin/agentforge" --version)
          if [ "$actual" != "$expected" ]; then
            echo "expected '$expected', got '$actual'" >&2
            exit 1
          fi
          echo "$actual"

      # `unslop` is the command that exercises the bundle hardest: it runs three
      # vendored scanners as subprocesses, and each has to find its sibling
      # `_lang` module and, for the silhouette scan, a reference fixture two
      # directories up. Package data that failed to ship, or that shipped
      # flattened, shows up here and nowhere else.
      - name: "`agentforge unslop` finds the vendored bundle"
        working-directory: ${{ runner.temp }}
        run: |
          cp "$GITHUB_WORKSPACE/README.md" prose.md

          # Exit 1 is findings in the prose, which is not what this job asks
          # about. Exit 2 is a scanner that could not run at all, which is.
          status=0
          "$RUNNER_TEMP/wheel-check/bin/agentforge" unslop --json prose.md > report.json || status=$?
          if [ "$status" -gt 1 ]; then
            cat report.json
            echo "a scanner could not run from the installed wheel" >&2
            exit 1
          fi

          "$RUNNER_TEMP/wheel-check/bin/python" - <<'PY'
          import json

          from agentforge_framework.core.skills import UNSLOP_SCANNERS

          report = json.loads(open("report.json", encoding="utf-8").read())
          scanners = report["scanners"]

          missing = [name for name in UNSLOP_SCANNERS if name not in scanners]
          broken = {name: r["error"] for name, r in scanners.items() if "error" in r}
          if missing or broken:
              for name in missing:
                  print(f"{name}: never ran")
              for name, error in broken.items():
                  print(f"{name}: {error}")
              raise SystemExit("the wheel's skill bundle is incomplete")

          print(f"{len(scanners)} scanners ran: {report['violations']} finding(s)")
          PY

      # Last, and deliberately so: a release attaches the wheel every check
      # above already ran against, rather than one built on a laptop (#53). A
      # wheel that failed those checks fails the job and is never uploaded.
      - name: Keep the wheel for a release to attach
        uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error
